name: APK bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PbuildNummer=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk Startseite.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Startseite-${{ github.run_number }}
          path: Startseite.apk

      - name: Als Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" Startseite.apk \
            --target "${{ github.sha }}" \
            --title "Startseite Build ${{ github.run_number }}" \
            --notes "Automatisch gebaut aus ${{ github.ref_name }} (${GITHUB_SHA::7}). Installation: siehe README." \
            --latest
